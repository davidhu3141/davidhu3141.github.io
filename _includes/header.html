<header class="site-header">
  <div class="shell header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="主要導覽">
      <a href="{{ '/articles/' | relative_url }}"{% if page.url == '/articles/' %} aria-current="page"{% endif %}>文章</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>關於</a>
      <a href="https://github.com/{{ site.github_username }}" rel="me">GitHub <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
